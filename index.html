<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUXIS STORE — คอมพิวเตอร์ & อุปกรณ์เกมมิ่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#eef1f6; --paper:#0a0f17; --card:#121a26; --card2:#0e1520;
  --orange:#ff6a1a; --orange-deep:#e0490a; --red:#ff3b3b; --line:#243046; --muted:#8a93a6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --ink:#141821; --paper:#f3f4f7; --card:#ffffff; --card2:#f9f9fb; --line:#dfe2ea; --muted:#6b7280;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Kanit',sans-serif;}

.topbar{
  position:sticky; top:0; z-index:15; background:var(--paper); border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px; display:flex; align-items:center; justify-content:space-between;
}
.brand{font-family:'Kanit',sans-serif; font-weight:700; font-size:19px; letter-spacing:.3px;}
.brand span{color:var(--orange);}

.screen{display:none; padding:0 0 90px; max-width:1080px; margin:0 auto;}
.screen.active{display:block;}
.screen-pad{padding:0 20px;}

.banner{width:100%; display:block; margin-bottom:22px;}
.banner img{width:100%; display:block;}

.nav-cats{display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; scrollbar-width:none; padding:0 20px;}
.nav-cats::-webkit-scrollbar{display:none;}
.cat-chip{flex:none; padding:8px 15px; border:1px solid var(--line); border-radius:999px; background:var(--card); font-size:13px; cursor:pointer; color:var(--muted); white-space:nowrap; font-weight:500;}
.cat-chip.active{background:linear-gradient(135deg,var(--orange),var(--red)); color:#fff; border-color:transparent;}

.section-label{font-size:13px; color:var(--muted); margin:0 0 14px; padding:0 20px; font-weight:500;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:0 20px;}
@media (min-width:640px){ .grid{grid-template-columns:1fr 1fr 1fr;} }
@media (min-width:920px){ .grid{grid-template-columns:repeat(4,1fr);} }
.product{background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; transition:border-color .15s ease, transform .15s ease;}
.product:hover{border-color:var(--orange); transform:translateY(-2px);}
.swatch{height:110px; display:flex; align-items:center; justify-content:center; font-family:'Kanit',sans-serif; font-size:14px; color:#fff; font-weight:600; text-align:center; padding:8px;}
.p-body{padding:12px;}
.p-tag{font-size:11px; color:var(--orange); margin:0 0 4px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
.p-name{font-size:14px; margin:0 0 8px; font-weight:600; line-height:1.3; min-height:2.6em;}
.p-row{display:flex; justify-content:space-between; align-items:center; gap:6px;}
.p-price{font-weight:700; font-size:15px; color:var(--orange);}
.add-btn{background:linear-gradient(135deg,var(--orange),var(--orange-deep)); color:#fff; border:none; border-radius:5px; padding:7px 10px; font-size:12px; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600;}
.no-result{color:var(--muted); text-align:center; padding:60px 20px; font-size:14px; grid-column:1/-1;}

.search-wrap{position:relative; margin:0 20px 18px;}
.search-wrap input{width:100%; padding:12px 14px 12px 38px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); font-size:15px; font-family:'Inter',sans-serif;}
.search-wrap input:focus{outline:2px solid var(--orange); outline-offset:1px;}
.search-icon-in{position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.5;}

.cart-list{list-style:none; margin:0; padding:0;}
.cart-item{display:flex; justify-content:space-between; gap:10px; padding:14px 0; border-bottom:1px solid var(--line); font-size:14px;}
.cart-item .qty-ctrl{display:flex; align-items:center; gap:8px; margin-top:6px;}
.qty-ctrl button{width:24px; height:24px; border:1px solid var(--line); background:var(--card2); border-radius:5px; cursor:pointer; font-size:14px; color:var(--ink);}
.cart-summary{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-top:16px;}
.total-row{display:flex; justify-content:space-between; font-weight:700; margin-bottom:14px; font-size:16px;}
.checkout-btn{width:100%; padding:13px; background:linear-gradient(135deg,var(--orange),var(--red)); color:#fff; border:none; border-radius:6px; font-size:15px; cursor:pointer; font-family:'Kanit',sans-serif; font-weight:600;}
.back-link{background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:0; margin-bottom:14px;}
.empty-note{color:var(--muted); font-size:14px; padding:50px 0; text-align:center;}

.pay-method{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:10px; cursor:pointer;}
.pay-method.selected{border-color:var(--orange); background:rgba(255,106,26,.08);}
.pay-method input{accent-color:var(--orange);}
.pay-fields{margin-top:6px;}
.pay-fields input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:5px; background:var(--card2); color:var(--ink); font-size:14px; margin-bottom:10px; font-family:'Inter',sans-serif;}
.pay-fields.hidden{display:none;}
.field-row{display:flex; gap:10px;}
.field-row input{flex:1;}
.confirm{text-align:center; padding:60px 10px;}
.confirm .mark{width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,var(--orange),var(--red)); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:22px;}

.notif-item{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
.notif-dot{width:8px; height:8px; border-radius:50%; background:var(--orange); margin-top:6px; flex:none;}
.notif-item.read .notif-dot{background:var(--line);}
.notif-title{font-size:14px; font-weight:500; margin:0 0 2px;}
.notif-time{font-size:12px; color:var(--muted); margin:0;}

.profile-head{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
.avatar{width:56px; height:56px; border-radius:12px; background:linear-gradient(135deg,var(--orange),var(--red)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Kanit',sans-serif; font-size:22px; font-weight:700;}
.profile-name{font-size:18px; font-weight:600; margin:0 0 2px;}
.profile-email{font-size:13px; color:var(--muted); margin:0;}
.profile-list{background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.profile-row{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer;}
.profile-row:last-child{border-bottom:none;}
.profile-row .arrow{color:var(--muted); font-size:14px;}

.overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.overlay.show{opacity:1; pointer-events:auto;}
.panel{
  position:fixed; top:0; right:0; height:100%; width:min(400px,92vw); background:var(--paper); z-index:31;
  transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-shadow:-8px 0 24px rgba(0,0,0,.4);
  border-left:1px solid var(--line);
}
.panel.show{transform:translateX(0);}
.panel-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line);}
.panel-close{background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; line-height:1;}
.panel-body{padding:20px; overflow-y:auto; flex:1;}
.detail-swatch{height:200px; border-radius:8px;}
.detail-desc{color:var(--muted); font-size:14px; line-height:1.7; margin:14px 0;}
.detail-meta{display:flex; gap:18px; font-size:13px; color:var(--muted); margin-bottom:16px;}

.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--card); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-item{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px 8px; cursor:pointer; color:var(--muted); font-family:'Inter',sans-serif; font-size:11px; position:relative;}
.nav-item.active{color:var(--orange);}
.nav-item svg{width:22px; height:22px;}
.nav-badge{position:absolute; top:4px; right:calc(50% - 18px); background:var(--red); color:#fff; border-radius:999px; min-width:15px; height:15px; font-size:9px; display:flex; align-items:center; justify-content:center; padding:0 3px;}
</style>
</head>

  {id:6, name:"DDR5 16GB (8x2) 5600MHz", tag:"แรม", cat:'ram', price:1990, color:"#231a2c", desc:"แรมมาตรฐานสำหรับสายประกอบทั่วไป เสถียรและราคาคุ้มค่า"},
  {id:7, name:"เคสเกมมิ่ง ARGB กระจกฝั่งเดียว", tag:"เคส", cat:'case', price:1590, color:"#101826", desc:"ดีไซน์เกมมิ่ง ระบายอากาศดี รองรับพัดลม ARGB สูงสุด 6 ตัว"},
  {id:8, name:"พาวเวอร์ซัพพลาย 750W 80+ Gold", tag:"พาวเวอร์", cat:'case', price:2890, color:"#301616", desc:"จ่ายไฟเสถียรสำหรับสเปคระดับกลาง-สูง สายถอดได้ทั้งชุด รับประกัน 7 ปี"},
  {id:9, name:"คีย์บอร์ดเกมมิ่ง Mechanical RGB", tag:"อุปกรณ์เสริม", cat:'acc', price:1690, color:"#331515", desc:"สวิตช์ Blue คลิกหนึบ ไฟ RGB ปรับได้ทุกปุ่ม โครงอลูมิเนียม"},
  {id:10, name:"เมาส์เกมมิ่ง Wireless 26000DPI", tag:"อุปกรณ์เสริม", cat:'acc', price:1290, color:"#2c1010", desc:"น้ำหนักเบา เซนเซอร์แม่นยำสูง แบตอึด ใช้งานได้กว่า 70 ชั่วโมง"}
];
const notifications = [
  {title:"คำสั่งซื้อ #LX2201 กำลังจัดส่ง", time:"5 นาทีที่แล้ว", read:false},
  {title:"โปรโมชั่น: ลด 10% การ์ดจอทุกรุ่น", time:"2 ชั่วโมงที่แล้ว", read:false},
  {title:"คำสั่งซื้อ #LX2195 จัดส่งสำเร็จ", time:"เมื่อวาน", read:true},
  {title:"สินค้าใหม่: RTX 4070 Super เข้าสต๊อกแล้ว", time:"3 วันก่อน", read:true}
];

let cart = {}; let activeCat = 'all'; let selectedPay = 'card';
function money(n){ return n.toLocaleString('th-TH'); }
function productCard(p){
  return `<div class="product" onclick="openDetail(${p.id})">
    <div class="swatch" style="background:${p.color}">${p.name}</div>
    <div class="p-body"><p class="p-tag">${p.tag}</p><p class="p-name">${p.name}</p>
      <div class="p-row"><span class="p-price">฿${money(p.price)}</span>
        <button class="add-btn" onclick="event.stopPropagation(); addToCart(${p.id})">ใส่ตะกร้า</button></div>
    </div></div>`;
}
function renderCatNav(){
  document.getElementById('catNav').innerHTML = categories.map(c=>`<button class="cat-chip ${c.id===activeCat?'active':''}" onclick="setCat('${c.id}')">${c.name}</button>`).join('');
}
function setCat(id){ activeCat=id; renderCatNav(); renderHomeGrid(); }
function renderHomeGrid(){
  const list = activeCat==='all' ? products : products.filter(p=>p.cat===activeCat);
  document.getElementById('resultLabel').textContent = activeCat==='all' ? 'สินค้าทั้งหมด' : categories.find(c=>c.id===activeCat).name;
  document.getElementById('grid').innerHTML = list.map(productCard).join('');
}
function renderSearch(term){
  const label = document.getElementById('searchLabel'); const grid = document.getElementById('searchGrid');
  if(!term){ label.textContent = 'พิมพ์เพื่อค้นหาสินค้า'; grid.innerHTML=''; return; }
  const list = products.filter(p=>p.name.toLowerCase().includes(term)||p.tag.toLowerCase().includes(term));
  label.textContent = `ผลค้นหา "${term}" (${list.length})`;
  grid.innerHTML = list.length ? list.map(productCard).join('') : '<p class="no-result">ไม่พบสินค้าที่ค้นหา</p>';
}
function openDetail(id){
  const p = products.find(x=>x.id===id);
  document.getElementById('detailBody').innerHTML = `
    <div class="swatch detail-swatch" style="background:${p.color}">${p.name}</div>
    <h2 style="margin:16px 0 4px; font-size:20px;">${p.name}</h2>
    <div class="detail-meta"><span>${p.tag}</span><span>สินค้าใหม่ พร้อมส่ง</span></div>
    <p class="detail-desc">${p.desc}</p>
    <div class="p-row" style="margin-bottom:18px;"><span class="p-price" style="font-size:20px;">฿${money(p.price)}</span></div>
    <button class="checkout-btn" onclick="addToCart(${p.id}); closeDetail();">ใส่ตะกร้า</button>`;
  document.getElementById('overlay').classList.add('show'); document.getElementById('detailPanel').classList.add('show');
}
function closeDetail(){ document.getElementById('overlay').classList.remove('show'); document.getElementById('detailPanel').classList.remove('show'); }
function addToCart(id){ cart[id]=(cart[id]||0)+1; updateCartBadge(); if(document.getElementById('screen-cart').classList.contains('active')) renderCart(); }
function changeQty(id, delta){ cart[id]=(cart[id]||0)+delta; if(cart[id]<=0) delete cart[id]; updateCartBadge(); renderCart(); }
function updateCartBadge(){
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const badge = document.getElementById('cartBadge'); badge.textContent = count; badge.style.display = count>0 ? 'flex' : 'none';
}
function cartTotal(){ return Object.keys(cart).reduce((s,id)=>s+products.find(p=>p.id==id).price*cart[id],0); }
function renderCart(){
  const body = document.getElementById('cartBody'); const ids = Object.keys(cart);
  if(ids.length===0){ body.innerHTML = '<p class="empty-note">ยังไม่มีสินค้าในตะกร้า</p>'; return; }
  body.innerHTML = '<ul class="cart-list">' + ids.map(id=>{
    const p = products.find(x=>x.id==id); const qty = cart[id];
    return `<li class="cart-item"><div><div style="font-weight:500;">${p.name}</div>
      <div class="qty-ctrl"><button onclick="changeQty(${id},-1)">−</button><span>${qty}</span><button onclick="changeQty(${id},1)">+</button></div>
      </div><div>฿${money(p.price*qty)}</div></li>`;
  }).join('') + '</ul>' + `<div class="cart-summary"><div class="total-row"><span>ยอดรวม</span><span>฿${money(cartTotal())}</span></div>
    <button class="checkout-btn" onclick="renderPayment()">ไปหน้าชำระเงิน</button></div>`;
}
function renderPayment(){
  const methods = [{id:'card',label:'บัตรเครดิต / เดบิต'},{id:'promptpay',label:'พร้อมเพย์ (QR)'},{id:'cod',label:'เก็บเงินปลายทาง'}];
  document.getElementById('cartBody').innerHTML = `
    <button class="back-link" onclick="renderCart()">‹ กลับไปที่ตะกร้า</button>
    ${methods.map(m=>`<label class="pay-method ${selectedPay===m.id?'selected':''}" onclick="selectPay('${m.id}')">
      <input type="radio" name="pay" ${selectedPay===m.id?'checked':''}><span>${m.label}</span></label>`).join('')}
    <div class="pay-fields ${selectedPay==='card'?'':'hidden'}"><input type="text" placeholder="หมายเลขบัตร">
      <div class="field-row"><input type="text" placeholder="MM/YY"><input type="text" placeholder="CVC"></div></div>
    <div class="pay-fields ${selectedPay==='promptpay'?'':'hidden'}"><p style="color:var(--muted); font-size:13px; margin:0 0 10px;">สแกน QR เพื่อชำระผ่านแอปธนาคาร (ตัวอย่าง)</p></div>
    <div class="pay-fields ${selectedPay==='cod'?'':'hidden'}"><input type="text" placeholder="ที่อยู่จัดส่ง"></div>
    <div class="cart-summary"><div class="total-row"><span>ยอดชำระ</span><span>฿${money(cartTotal())}</span></div>
    <button class="checkout-btn" onclick="checkout()">ยืนยันการสั่งซื้อ</button></div>`;
}
function selectPay(id){ selectedPay=id; renderPayment(); }
function checkout(){
  document.getElementById('cartBody').innerHTML = `<div class="confirm"><div class="mark">✓</div>
    <h3 style="margin:0 0 8px;">สั่งซื้อเรียบร้อย</h3>
    <p style="color:var(--muted); font-size:14px;">ขอบคุณที่อุดหนุน LUXIS STORE (หน้าตัวอย่าง ยังไม่มีการตัดเงินจริง)</p></div>`;
  cart = {}; updateCartBadge();
}
function renderNotif(){
  document.getElementById('notifBody').innerHTML = notifications.map(n=>`
    <div class="notif-item ${n.read?'read':''}"><div class="notif-dot"></div>
      <div><p class="notif-title">${n.title}</p><p class="notif-time">${n.time}</p></div></div>`).join('');
}
const topbarLabels = {home:'หน้าหลัก', search:'ค้นหา', cart:'ตะกร้า', notif:'การแจ้งเตือน', profile:'โปรไฟล์'};
function switchScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.screen===name));
  document.getElementById('topbarSub').textContent = topbarLabels[name];
  if(name==='cart') renderCart(); if(name==='notif') renderNotif();
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click', ()=>switchScreen(btn.dataset.screen)));
document.getElementById('searchInput').addEventListener('input', e=>renderSearch(e.target.value.trim().toLowerCase()));
document.getElementById('detailClose').addEventListener('click', closeDetail);
document.getElementById('overlay').addEventListener('click', closeDetail);
renderCatNav(); renderHomeGrid();
</script>
</body>
</html>
